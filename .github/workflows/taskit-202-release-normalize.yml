name: TASKIT-202 release normalization

on:
  push:
    branches:
      - agent/taskit-202-project-crud

permissions:
  contents: write

jobs:
  normalize:
    # Temporary branch-only normalization; removed before merge.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/taskit-202-project-crud
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npx prettier --write package.json package-lock.json .github/workflows/quality.yml AGENTS.md README.md src/app/api/health/route.ts test/release-health.test.mjs e2e/auth.spec.ts
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No normalization changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/quality.yml AGENTS.md README.md src/app/api/health/route.ts test/release-health.test.mjs e2e/auth.spec.ts
          git commit -m "chore: normalize release verification"
          git push origin HEAD:agent/taskit-202-project-crud
