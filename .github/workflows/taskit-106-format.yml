name: TASKIT-106 source formatting

on:
  push:
    branches:
      - agent/taskit-106-onboarding

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taskit-106-onboarding
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/app/onboarding/onboarding.module.css src/app/onboarding/page.tsx test/onboarding.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/app/onboarding/onboarding.module.css src/app/onboarding/page.tsx test/onboarding.test.mjs; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/onboarding/onboarding.module.css src/app/onboarding/page.tsx test/onboarding.test.mjs
          git commit -m "style: format minimal onboarding"
          git push origin HEAD:agent/taskit-106-onboarding
