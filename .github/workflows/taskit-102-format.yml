name: TASKIT-102 source formatting

on:
  push:
    branches:
      - agent/taskit-102-auth

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/taskit-102-auth
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/app/app/page.tsx src/app/login/page.tsx
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/app/app/page.tsx src/app/login/page.tsx; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/app/page.tsx src/app/login/page.tsx
          git commit -m "style: format TASKIT-102 pages"
          git push origin HEAD:agent/taskit-102-auth
