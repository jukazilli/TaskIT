name: Canonicalize planning capacity

on:
  push:
    branches:
      - docs/taskit-planning-capacity

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'docs: canonicalize planning capacity model') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/taskit-planning-capacity
      - name: Update canonical docs and backlog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # 00 — product brief
          replace_once(
              "docs/00-product-brief.md",
              "TaskIT resolve isso criando um plano semanal visual, executável e ajustável.",
              "TaskIT resolve isso criando um plano semanal visual, executável e ajustável — e validando se o esforço conhecido realmente cabe no tempo disponível antes dos prazos.",
          )
          replace_once(
              "docs/00-product-brief.md",
              "TaskIT deve responder rapidamente a quatro perguntas:\n\n1. O que preciso fazer?\n2. O que importa mais agora?\n3. Quando vou fazer?\n4. Estou avançando no ritmo esperado?",
              "TaskIT deve responder rapidamente a cinco perguntas:\n\n1. O que preciso fazer?\n2. O que importa mais agora?\n3. Quando vou fazer?\n4. Isso realmente cabe no tempo que tenho?\n5. Estou avançando no ritmo esperado?\n\nA tese central evolui de organizar tarefas para **fazer caber**: transformar demanda, esforço, prazos e disponibilidade em um plano possível.",
          )
          replace_once(
              "docs/00-product-brief.md",
              "- tarefas podem existir sem data, mas o produto deve incentivar alocação realista.",
              "- tarefas podem existir sem data, mas o produto deve incentivar alocação realista;\n- tempo é um recurso finito: uma lista de tarefas não deve ser tratada automaticamente como um plano possível;\n- sessão de estudo consome um intervalo real da disponibilidade;\n- conflitos de capacidade devem ser explicáveis em linguagem humana, sem jargão industrial.",
          )
          replace_once(
              "docs/00-product-brief.md",
              "O MVP é bem-sucedido quando um usuário consegue conectar ou ignorar o Google Calendar, criar seus objetivos, organizar tarefas, montar a semana, enxergar conflitos, acompanhar progresso e replanejar rapidamente em celular ou desktop sem precisar aprender um sistema complexo.",
              "O MVP é bem-sucedido quando um usuário consegue conectar ou ignorar o Google Calendar, criar seus objetivos, organizar tarefas, informar disponibilidade suficiente para planejar, montar uma semana possível, enxergar conflitos temporais e de capacidade, acompanhar progresso e replanejar rapidamente em celular ou desktop sem precisar aprender um sistema complexo.",
          )

          # 01 — PO vision
          replace_once(
              "docs/01-product-owner-vision.md",
              "O produto não deve premiar planejamento excessivo. Deve privilegiar clareza, execução e replanejamento simples.",
              "O produto não deve premiar planejamento excessivo. Deve privilegiar clareza, execução e replanejamento simples. A partir do modelo de capacidade, também deve distinguir uma lista desejada de um plano que realmente cabe no tempo do usuário.",
          )
          replace_once(
              "docs/01-product-owner-vision.md",
              "- mover itens não concluídos sem punição visual.\n\n### 3.4 Projetos e objetivos",
              "- mover itens não concluídos sem punição visual.\n\n#### 3.3.1 Planejamento por capacidade\n\nO planejamento semanal deve comparar demanda de esforço com capacidade real disponível.\n\nRegras de produto:\n\n- tempo disponível é finito;\n- disponibilidade típica é apenas capacidade potencial;\n- sessões e compromissos bloqueadores consomem intervalos;\n- prazo limita quais intervalos podem satisfazer uma tarefa;\n- TaskIT deve distinguir conflito temporal de falta de tempo total;\n- o cálculo inicial é determinístico e explicável;\n- tarefa sem estimativa continua válida, mas o diagnóstico de capacidade deve reconhecer que há esforço desconhecido;\n- quando o plano não couber, oferecer caminhos de replanejamento sem alterar silenciosamente compromissos importantes.\n\nNa UX, não expor jargão como utilização ou déficit de recurso. Preferir mensagens como “Faltam cerca de 2 horas para fazer tudo que você planejou”.\n\n### 3.4 Projetos e objetivos",
          )
          replace_once(
              "docs/01-product-owner-vision.md",
              "Uma tarefa pode gerar múltiplas sessões.",
              "Uma tarefa pode gerar múltiplas sessões. A tarefa representa demanda total; as sessões representam partes dessa demanda alocadas em intervalos reais. O domínio deve conseguir separar esforço concluído, futuro já planejado e ainda sem horário quando a tarefa possui estimativa.",
          )
          replace_once(
              "docs/01-product-owner-vision.md",
              "- escolha de calendários a considerar;\n- leitura de eventos para disponibilidade e conflitos;",
              "- escolha de calendários a considerar;\n- cada calendário selecionado pode ser bloqueador de tempo ou apenas informativo;\n- leitura de eventos para disponibilidade e conflitos;",
          )
          replace_once(
              "docs/01-product-owner-vision.md",
              "- calendário externo pode bloquear tempo, mas não altera prioridade da tarefa;",
              "- calendário externo configurado como bloqueador reduz capacidade, mas não altera prioridade da tarefa;\n- uma semana pode estar inviável mesmo sem sobreposição direta quando o esforço necessário supera o tempo disponível;\n- tempo depois do prazo não torna viável uma tarefa que vence antes;\n- diagnósticos de capacidade devem ser objetivos, testáveis e explicáveis;",
          )

          # 02 — UI vision
          replace_once(
              "docs/02-ui-vision.md",
              "### 8.5 Command Palette",
              "### 8.5 Resumo de capacidade\n\nQuando a interface precisar comunicar viabilidade do plano, usar poucos números acionáveis, por exemplo:\n\n- tempo disponível;\n- tempo planejado;\n- esforço ainda sem horário;\n- déficit somente quando existir.\n\nNão criar gauges industriais, percentuais opacos ou heatmaps complexos como padrão. Estados como semana apertada ou dia sobrecarregado precisam combinar texto, hierarquia e sinal visual que não dependa apenas de cor.\n\n### 8.6 Command Palette",
          )
          replace_once(
              "docs/02-ui-vision.md",
              "- **Semana** — progresso e carga resumida;",
              "- **Semana** — progresso e capacidade resumida, mostrando apenas o necessário para decidir se ainda existe espaço ou se há esforço sem horário;",
