              "- vínculo Calendar deve permitir idempotência e evitar duplicação.\n\n## 6. Autenticação e autorização",
              "- vínculo Calendar deve permitir idempotência e evitar duplicação.\n\n### 5.1 Domínio de planejamento e capacidade\n\nO planejamento por capacidade é uma regra de domínio central. O motor inicial deve ser determinístico, puro e independente de React, SQL, Neon, Google Calendar e LLM.\n\nFontes conceituais:\n\n- demanda: estimativa/prazo da tarefa;\n- capacidade potencial: `availability_window` no timezone do usuário;\n- ocupações: sessões TaskIT e eventos externos configurados como bloqueadores;\n- alocação: `StudySession`;\n- resultado derivado: minutos disponíveis, planejados, necessários, ainda sem horário, livres e em déficit, além de conflitos explicáveis.\n\nRegras técnicas:\n\n- unir intervalos sobrepostos antes de descontar ocupações;\n- não persistir tempo livre ou percentuais de capacidade como fonte de verdade sem necessidade medida;\n- tempo posterior ao prazo não satisfaz demanda anterior;\n- tarefas sem estimativa continuam válidas;\n- timezone e fronteiras locais de dia/semana são parte da regra;\n- IA pode atuar após o diagnóstico, nunca substituir o cálculo.\n\nO contrato canônico está em `docs/07-planning-capacity-model.md` e a decisão arquitetural em ADR 0007.\n\n## 6. Autenticação e autorização",
          )
          replace_once(
