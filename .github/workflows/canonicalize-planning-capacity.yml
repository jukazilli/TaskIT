              "### Próximos itens\n\n1. **TASKIT-205 — Lista e edição contextual de tarefas**;\n2. **TASKIT-109 — Configurar disponibilidade típica para planejamento**;\n3. **TASKIT-301 — Schema de sessões de estudo**;\n4. **TASKIT-302 — Motor de planejamento e capacidade**;\n5. **TASKIT-305 — Criar sessões a partir da tarefa**;\n6. **TASKIT-303/304 — Visão Semana desktop/mobile**;\n7. **TASKIT-306 — Concluir e replanejar sessão**.\n\nTASKIT-107 permanece **pausado e não concluído** após a tentativa com o provider gerenciado. Uma futura revisão pode adotar OAuth próprio no Google Cloud, mas essa alternativa ainda não é decisão arquitetural e não bloqueia o núcleo do produto. Login e autorização de Google Calendar continuam capacidades separadas.\n\nA nova regra estrutural é: não implementar M3 com o antigo conceito de “carga” para depois refazê-lo. `docs/07-planning-capacity-model.md` e ADR 0007 são referência obrigatória para o caminho crítico de planejamento.",
          )
          replace_once(
              "docs/06-backlog.md",
              "**Prioridade:** P0\n**Depende de:** TASKIT-102, TASKIT-005\n\n### Objetivo\nAdicionar Google como método conveniente de autenticação",
              "**Prioridade:** P0\n**Estado:** pausado; não bloqueia o caminho crítico do MVP de planejamento.\n**Depende de:** TASKIT-102, TASKIT-005\n\n### Objetivo\nAdicionar Google como método conveniente de autenticação",
          )

          # Insert TASKIT-109 before M2.
          replace_once(
              "docs/06-backlog.md",
              "---\n\n# M2 — Projetos, tarefas e inbox",
              "---\n\n## TASKIT-109 — Configurar disponibilidade típica para planejamento\n\n**Prioridade:** P0\n**Depende de:** TASKIT-103, TASKIT-106\n\n### Objetivo\nPermitir que o usuário mantenha as janelas recorrentes que representam quando normalmente existe tempo planejável, usando o schema `availability_window` já criado.\n\n### Escopo\n- editar dias e intervalos normalmente disponíveis;\n- respeitar timezone e semana configurados;\n- experiência curta em mobile e desktop;\n- permitir múltiplas janelas no mesmo dia quando necessário;\n- não assumir 24 horas disponíveis;\n- não introduzir automaticamente buffer, preferência de período ou regras avançadas de sessão;\n- não persistir tempo livre derivado.\n\n### Aceite\n- usuário consegue consultar e alterar sua disponibilidade típica;\n- intervalos inválidos ou invertidos são rejeitados;\n- ownership é garantido no servidor;\n- estado vazio é válido e explicado sem quebrar o produto;\n- TASKIT-302 consegue consumir essas janelas como capacidade potencial;\n- cobertura inclui timezone/ordenação e intervalos do mesmo dia.\n\n---\n\n# M2 — Projetos, tarefas e inbox",
