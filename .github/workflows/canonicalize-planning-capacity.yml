name: Canonicalize planning capacity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Apply canonical planning updates
        run: python .github/scripts/canonicalize_planning_capacity.py
      - name: Commit canonical docs
        run: |
          if git diff --quiet -- docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: canonicalize planning capacity model"
          git push origin HEAD:${{ github.head_ref }}
