              "Regras puras: normalização/união de intervalos, disponibilidade, esforço restante, capacidade, conflito temporal, conflito de capacidade, viabilidade antes do prazo, progresso, recálculo e status. Casos obrigatórios incluem tarefa sem estimativa, ausência de disponibilidade, timezone e DST quando aplicável.",
