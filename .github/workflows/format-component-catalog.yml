name: Format component catalog smoke

on:
  push:
    branches:
      - agent/taskit-007-component-catalog

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format target
        run: npx prettier --write e2e/components-catalog.spec.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- e2e/components-catalog.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/components-catalog.spec.ts
          git commit -m "style: apply repository Prettier to catalog smoke"
          git push origin HEAD:${{ github.ref_name }}
