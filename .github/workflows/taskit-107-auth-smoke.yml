name: TASKIT-107 auth smoke

on:
  push:
    branches:
      - diag/taskit-107-auth-smoke
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify development email signup and Google OAuth initiation
        env:
          AUTH_BASE_URL: https://ep-solitary-king-awo05x6w.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth
          AUTH_ORIGIN: https://taskit-auth-smoke.vercel.app
        run: |
          node <<'NODE'
          const baseUrl = process.env.AUTH_BASE_URL;
          const origin = process.env.AUTH_ORIGIN;
          const runId = process.env.GITHUB_RUN_ID;
          const email = `taskit-auth-smoke-${runId}@example.invalid`;
          const password = `TaskIT-Smoke-${runId}!Abc`;

          async function post(path, body) {
            return fetch(`${baseUrl}/${path}`, {
              method: "POST",
              headers: {
                "content-type": "application/json",
                origin,
              },
              body: JSON.stringify(body),
              redirect: "manual",
            });
          }

          const signup = await post("sign-up/email", {
            name: "TaskIT Auth Smoke",
            email,
            password,
            callbackURL: "/app",
          });

          if (!signup.ok) {
            throw new Error(`Email signup failed with HTTP ${signup.status}`);
          }
          console.log("email signup: ok");

          const social = await post("sign-in/social", {
            provider: "google",
            callbackURL: "/app",
            newUserCallbackURL: "/app",
            errorCallbackURL: "/login?error=google-signin-failed",
            disableRedirect: true,
          });

          if (!social.ok) {
            throw new Error(`Google OAuth initiation failed with HTTP ${social.status}`);
          }

          const socialData = await social.json();
          const initUrl = String(socialData?.url ?? "");

          if (!initUrl) {
            throw new Error("Google OAuth response did not include an init URL");
          }

          const initResponse = await fetch(initUrl, { redirect: "manual" });
          const providerLocation = initResponse.headers.get("location");

          if (!providerLocation) {
            throw new Error(
              `Google OAuth init did not return a redirect (HTTP ${initResponse.status})`,
            );
          }

          const providerUrl = new URL(providerLocation);
          if (!providerUrl.hostname.endsWith("google.com")) {
            throw new Error(
              `OAuth init redirected to unexpected host: ${providerUrl.hostname}`,
            );
          }

          console.log(
            `google oauth initiation: ok (${providerUrl.hostname}${providerUrl.pathname})`,
          );
          NODE
