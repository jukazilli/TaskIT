name: Update Neon Auth lockfile

on:
  push:
    branches:
      - fix/taskit-107-oauth-session-cookie

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh Neon Auth lockfile') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/taskit-107-oauth-session-cookie
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install @neondatabase/auth@0.5.0-beta --save-exact --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh Neon Auth lockfile"
          git push
