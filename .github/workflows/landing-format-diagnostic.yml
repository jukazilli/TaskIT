name: Landing formatting diagnostic

on:
  push:
    branches:
      - feat/taskit-108-public-landing

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print Prettier diff
        run: |
          npx prettier --write src/app/page.tsx src/app/opengraph-image.tsx
          git diff -- src/app/page.tsx src/app/opengraph-image.tsx
          exit 1
