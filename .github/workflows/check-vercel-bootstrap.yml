name: Check Vercel bootstrap credential

on:
  push:
    branches:
      - agent/taskit-003-vercel-bootstrap

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check credential presence without exposing it
        shell: bash
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_PRESENT=true"
          else
            echo "VERCEL_TOKEN_PRESENT=false"
          fi
