name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Responsive Playwright smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public development-branch Auth endpoint. E2E only performs anonymous
      # session checks; it never creates or mutates users.
      NEON_AUTH_BASE_URL: https://ep-solitary-king-awo05x6w.neonauth.c-12.us-east-1.aws.neon.tech/neondb/auth
      # Runner-only signing key for an anonymous smoke session cache.
      # This is deliberately not a production/development application secret.
      NEON_AUTH_COOKIE_SECRET: taskit-ci-only-cookie-secret-never-use-outside-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run responsive smoke tests
        run: npm run test:e2e
